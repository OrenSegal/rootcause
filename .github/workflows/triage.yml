name: triage

# Runs when the ci workflow fails and writes a verdict to the job summary: did the change
# under test cause the failure, and which log lines say so. workflow_run runs in this
# repository's context on the default branch, so the checkout below is the default
# branch, never the pull request's code, and nothing from the pull request is executed.
# The token only reads: run logs and commits. The rules provider needs no key.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # Only to load ./triage from the default branch; the action installs its own tool.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./triage
        with:
          provider: rules
