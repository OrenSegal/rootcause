name: deploy-azure

# Manual only. Builds the telemetry MCP server image, pushes it to GHCR, and deploys
# deploy/azure/main.bicep with OIDC federated credentials, so no Azure secret is stored.
# Setup and the three repository secrets are in deploy/azure/README.md.
on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Existing resource group to deploy into
        default: rootcause-rg
      image_tag:
        description: Image tag (default is the commit SHA)
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The federated credential's subject is repo:<owner>/<repo>:environment:azure, so
    # it holds from any branch this workflow is dispatched on.
    environment: azure
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Name the image
        # GHCR names must be lowercase and the owner may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rootcause-telemetry" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "${{ inputs.resource_group }}" \
            --template-file deploy/azure/main.bicep \
            --parameters image="$IMAGE" imageTag="$TAG" \
            --query properties.outputs

      - name: Smoke test
        run: |
          url=$(az deployment group show --resource-group "${{ inputs.resource_group }}" \
            --name main --query properties.outputs.url.value -o tsv)
          # A cold start can take a while: retry for up to two minutes.
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "$url/healthz"
