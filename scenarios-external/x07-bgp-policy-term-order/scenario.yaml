# A routing policy change meant to tidy community tags reordered its terms on the spine
# routers of the largest sites, putting a reject ahead of the site-local advertisements.
# The prefixes were withdrawn, the internal load balancer lost its spread and small
# clusters overloaded. Reverting the policy fixed it. Source:
# https://blog.cloudflare.com/cloudflare-outage-on-june-21-2022/ (Cloudflare,
# 2022-06-21). Licence: none stated on the source page. Facts are paraphrased, no text
# is reproduced, and the telemetry is original. Runner-up reading: load-balancer
# (overloaded downstream of the withdrawal). Accepted services: none. Names, dates and
# scale changed; timeline compressed. Truth frozen 2026-11-07, before any run on this
# set, the heuristic included.
id: x07-bgp-policy-term-order
title: A reordered routing policy withdraws prefixes in the busiest sites
alert:
  service: edge
  summary: requests failing in 19 data centers, about half of all traffic.
truth:
  category: config_change
  service: spine-routers
  required_evidence_any:
  - cfg:d-E701:BGP_EXPORT_POLICY
  - d-E701
