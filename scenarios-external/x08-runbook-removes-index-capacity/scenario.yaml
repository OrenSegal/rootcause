# An operator ran a standard capacity-removal runbook against a small billing subsystem;
# a mistyped input removed far more hosts, including most of object-index. With the
# index below its minimum, the object store could not serve reads or writes, and
# functions and vm-launch, which load code and images from it, failed too. The removed
# capacity is platform infrastructure, so the category is infrastructure. Source:
# https://aws.amazon.com/message/41926/ (Amazon Web Services, 2017-02-28). Licence:
# copyright, all rights reserved, no licence granted. Facts are paraphrased, no text is
# reproduced, and the telemetry is original. Runner-up reading: config_change (an
# operator action); object-placement (also down, but because it depends on the index).
# Accepted services: object-store (the front end that fails every request). Names, dates
# and scale changed; timeline compressed. Truth frozen 2026-11-07, before any run on
# this set, the heuristic included.
id: x08-runbook-removes-index-capacity
title: A mistyped runbook command removes most of the object index
alert:
  service: functions
  summary: function invocations failing at 60%; new VM launches also failing.
truth:
  category: infrastructure
  service: object-index
  accepted_services:
  - object-store
  required_evidence_any:
  - log-0006
  - m-index-hosts
