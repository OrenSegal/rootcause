<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img">
<title>Sweep loop-haiku-2026-10-26: cost per solved incident vs pass rate</title>
<rect width="780" height="420" fill="#fff"/>
<text x="60" y="24" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="14" font-weight="bold">loop-haiku-2026-10-26: pass rate (95% Wilson interval) vs cost per solved incident</text>
<rect x="60" y="50" width="440" height="300" fill="none" stroke="#999"/>
<line x1="60" y1="350.0" x2="500" y2="350.0" stroke="#eee"/>
<text x="54" y="354.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">60%</text>
<line x1="60" y1="290.0" x2="500" y2="290.0" stroke="#eee"/>
<text x="54" y="294.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">65%</text>
<line x1="60" y1="230.0" x2="500" y2="230.0" stroke="#eee"/>
<text x="54" y="234.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">70%</text>
<line x1="60" y1="170.0" x2="500" y2="170.0" stroke="#eee"/>
<text x="54" y="174.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">75%</text>
<line x1="60" y1="110.0" x2="500" y2="110.0" stroke="#eee"/>
<text x="54" y="114.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">80%</text>
<line x1="60" y1="50.0" x2="500" y2="50.0" stroke="#eee"/>
<text x="54" y="54.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">85%</text>
<line x1="61.3" y1="50" x2="61.3" y2="350" stroke="#eee"/>
<text x="61.3" y="366" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="middle">$0.01</text>
<g data-config="loop-haiku-5.5-high-single">
<line x1="280.0" y1="174.0" x2="510" y2="174.0" stroke="#ccc"/>
<line x1="280.0" y1="304.5" x2="280.0" y2="72.3" stroke="#1f5fa8" stroke-width="1.5"/>
<circle cx="280.0" cy="174.0" r="4.5" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="512" y="178.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12">loop-haiku-5.5-high-single 75%, $0.0141</text>
</g>
<text x="60" y="388" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12">cost per solved incident (log scale, includes spend on failed runs). Filled: on the frontier. Hollow: dominated.</text>
</svg>
