<text x="54" y="311.1" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">60%</text>
<line x1="60" y1="264.3" x2="500" y2="264.3" stroke="#eee"/>
<text x="54" y="268.3" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">65%</text>
<line x1="60" y1="221.4" x2="500" y2="221.4" stroke="#eee"/>
<text x="54" y="225.4" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">70%</text>
<line x1="60" y1="178.6" x2="500" y2="178.6" stroke="#eee"/>
<text x="54" y="182.6" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">75%</text>
<line x1="60" y1="135.7" x2="500" y2="135.7" stroke="#eee"/>
<text x="54" y="139.7" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">80%</text>
<line x1="60" y1="92.9" x2="500" y2="92.9" stroke="#eee"/>
<text x="54" y="96.9" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">85%</text>
<line x1="60" y1="50.0" x2="500" y2="50.0" stroke="#eee"/>
<text x="54" y="54.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">90%</text>
<line x1="61.3" y1="50" x2="61.3" y2="350" stroke="#eee"/>
<text x="61.3" y="366" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="middle">$0.01</text>
<g data-config="loop-haiku-5.5-high-single">
<line x1="280.0" y1="181.4" x2="510" y2="181.4" stroke="#ccc"/>
<line x1="280.0" y1="318.6" x2="280.0" y2="55.7" stroke="#1f5fa8" stroke-width="1.5"/>
<circle cx="280.0" cy="181.4" r="4.5" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="1.5"/>
<text x="512" y="185.4" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12">loop-haiku-5.5-high-single 75%, $0.0141</text>
</g>
<text x="60" y="388" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12">cost per solved incident (log scale, includes spend on failed runs). Filled: on the frontier. Hollow: dominated.</text>
