<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img">
<title>Sweep loop-haiku-2026-10-26: cost per solved incident vs pass rate</title>
<rect width="780" height="420" fill="#fff"/>
