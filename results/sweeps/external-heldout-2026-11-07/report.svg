<svg xmlns="http://www.w3.org/2000/svg" width="780" height="436" viewBox="0 0 780 436" role="img">
<title>Sweep external-heldout-2026-11-07: cost per solved incident vs pass rate</title>
<rect width="780" height="436" fill="#fff"/>
