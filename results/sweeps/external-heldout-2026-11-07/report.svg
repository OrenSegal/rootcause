<text x="54" y="204.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">50%</text>
<line x1="60" y1="162.5" x2="500" y2="162.5" stroke="#eee"/>
<text x="54" y="166.5" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">55%</text>
<line x1="60" y1="125.0" x2="500" y2="125.0" stroke="#eee"/>
<text x="54" y="129.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">60%</text>
<line x1="60" y1="87.5" x2="500" y2="87.5" stroke="#eee"/>
<text x="54" y="91.5" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">65%</text>
<line x1="60" y1="50.0" x2="500" y2="50.0" stroke="#eee"/>
<text x="54" y="54.0" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="end">70%</text>
<line x1="170.5" y1="50" x2="170.5" y2="350" stroke="#eee"/>
<text x="170.5" y="366" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="middle">$0.005</text>
<line x1="286.7" y1="50" x2="286.7" y2="350" stroke="#eee"/>
<text x="286.7" y="366" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="middle">$0.006</text>
<line x1="384.8" y1="50" x2="384.8" y2="350" stroke="#eee"/>
<text x="384.8" y="366" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="middle">$0.007</text>
<line x1="469.9" y1="50" x2="469.9" y2="350" stroke="#eee"/>
<text x="469.9" y="366" font-family="Helvetica, Arial, sans-serif" fill="#222" font-size="12" text-anchor="middle">$0.008</text>
<g data-config="haiku-5.5-high">
<line x1="280.0" y1="200.0" x2="510" y2="200.0" stroke="#ccc"/>
